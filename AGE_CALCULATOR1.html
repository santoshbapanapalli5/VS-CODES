<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Age calculator</title>
    <style>
      body {
        background-color: white;
        color: blue;
        margin: 0;
        font-family: Arial, sans-serif;
      }

      h1 {
        color: blue;
        text-align: center;
        margin-top: 20px;
      }

      .info-text {
        color: black;
        text-align: center;
      }

      label {
        display: block;
        margin-top: 15px;
        margin-bottom: 15px;
        text-align: center;
        color: black;
      }

      #Firstdate,
      #Seconddate {
        display: block;
        margin: 10px auto;
        background-color: yellow;
      }

      .calculate {
        background-color: green;
        color: white;
        font-size: 25px;
        border: none;
        border-radius: 10px;
        width: 150px;
        height: 40px;
        display: block;
        margin: 0 auto;
        margin-top: 30px;
        cursor: pointer;
      }

      .calculate:hover {
        background-color: rgb(63, 219, 63);
      }

      .card {
        background-color: #eee;
        border: 1px solid #ccc;
        border-radius: 12px;
        width: 300px;
        padding: 20px;
        margin: 20px auto;
      }
    </style>
  </head>
  <body>
    <h1>Age calculator</h1>
    <p class="info-text">
      The Age Calculator can determine the age or interval between two dates.
    </p>

    <form action="AGE_CALCULATOR2.html" method="GET">
      <div class="card">
        <label for="Firstdate">First date</label>
        <input type="date" id="Firstdate" name="firstDate" required />

        <label for="Seconddate">Second date</label>
        <input type="date" id="Seconddate" name="secondDate" required />

        <button type="submit" class="calculate">Calculate</button>
      </div>
    </form>
  </body>
</html>
