<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Santosh's Web Page</title>
    <style>
        /* CSS: Styling the page */
        body {
            background-color: #1e1e2e;
            color: #a6adc8;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            color: #89b4fa;
        }

        button {
            background-color: #a6e3a1;
            color: #11111b;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            background-color: #94e2d5;
        }
    </style>
</head>
<body>

    <!-- HTML: Structure -->
    <h1>Welcome to My Website!</h1>
    <p>Click the button below to trigger JavaScript logic.</p>
    <button onclick="showAlert()">Click Me!</button>

    <script>
        // JavaScript: Interactive Logic
        function showAlert() {
            alert("Hello, Santosh! You just built your first web interaction!");
        }
    </script>

</body>
</html>
